name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://gosmaket-paint-bot.onrender.com/ > /dev/null
