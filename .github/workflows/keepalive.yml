name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

env:
  KEEPALIVE_UNTIL: "2028-10-22"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check keepalive window
        run: |
          if [[ "$(date -u +%F)" > "$KEEPALIVE_UNTIL" ]]; then
            echo "Keepalive window ended on $KEEPALIVE_UNTIL"
            exit 0
          fi
      - name: Ping Render
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://gosmaket-paint-bot.onrender.com/ > /dev/null
